<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Super Mundial 2026 - El Emperador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark:#04080e;
  --dark2:#080f1c;
  --card:rgba(10,18,35,.9);
  --border:rgba(0,220,255,.13);
  --gold:#f5c842;
  --gold2:#ffe98a;
  --neon:#00dcff;
  --purple:#7c5cff;
  --green:#00ff9d;
  --red:#ff4f6a;
  --text:#eef4ff;
  --muted:#6a8aad;
  --silver:#9ab0c8;
  --bronze:#c47a3a;
}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--dark);
  color:var(--text);
  font-size:14px;
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 10% 5%, rgba(0,220,255,.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 90% 10%, rgba(124,92,255,.09) 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 50% 100%, rgba(245,200,66,.04) 0%, transparent 50%);
}

/* ---- HEADER ---- */
.hdr{
  position:sticky;top:0;z-index:200;
  background:rgba(4,8,14,.92);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:12px 20px;
  display:flex;align-items:center;gap:14px;
}
.hdr-logo{
  font-family:'Bebas Neue',cursive;
  font-size:28px;letter-spacing:2px;
  background:linear-gradient(90deg,var(--neon),#fff,var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hdr-sub{font-size:11px;color:var(--muted)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}

/* ---- TABS ---- */
.tabs{
  position:sticky;top:57px;z-index:199;
  background:rgba(4,8,14,.9);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
  display:flex;gap:0;overflow-x:auto;
}
.tabs::-webkit-scrollbar{height:0}
.tab{
  font-family:'DM Sans',sans-serif;
  font-size:12px;font-weight:600;
  padding:11px 15px;
  background:transparent;color:var(--muted);
  cursor:pointer;border:none;
  border-bottom:2px solid transparent;
  white-space:nowrap;transition:all .15s;
  letter-spacing:.3px;
}
.tab:hover{color:var(--text)}
.tab.on{color:var(--neon);border-bottom:2px solid var(--neon)}
.sec{display:none;padding:16px 18px;position:relative;z-index:1}
.sec.on{display:block}

/* ---- BUTTONS ---- */
.btn{
  background:linear-gradient(135deg,var(--neon),var(--purple));
  border:none;border-radius:10px;color:#fff;
  padding:9px 16px;font-size:13px;cursor:pointer;
  font-weight:700;font-family:'DM Sans',sans-serif;
  box-shadow:0 4px 20px rgba(0,220,255,.25);
  transition:all .2s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(0,220,255,.4)}
.btn-sm{
  border-radius:8px;font-size:11px;font-weight:700;
  padding:5px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:all .15s;border:none;
}
.btn-outline{background:rgba(0,220,255,.1);border:1px solid rgba(0,220,255,.35);color:var(--neon)}
.btn-outline:hover{background:rgba(0,220,255,.2)}
.btn-del{background:rgba(255,79,106,.1);border:1px solid rgba(255,79,106,.4);color:var(--red)}
.btn-del:hover{background:rgba(255,79,106,.2)}
.btn-gold{
  background:linear-gradient(135deg,#f5c842,#c9902a);
  border:none;border-radius:10px;color:#1a0e00;
  padding:9px 18px;font-size:13px;cursor:pointer;
  font-weight:700;font-family:'DM Sans',sans-serif;
  box-shadow:0 4px 20px rgba(245,200,66,.3);
  transition:all .2s;
}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(245,200,66,.5)}
.btn-danger{
  background:rgba(255,79,106,.12);border:1px solid rgba(255,79,106,.4);
  border-radius:9px;color:var(--red);padding:8px 14px;
  font-size:12px;font-weight:700;cursor:pointer;
  font-family:'DM Sans',sans-serif;transition:all .15s;
}
.btn-danger:hover{background:rgba(255,79,106,.22)}

/* ---- CARDS ---- */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
}
.card-sm{border-radius:12px;padding:12px}

/* ---- SECTION TITLE ---- */
.sec-title{
  font-family:'Bebas Neue',cursive;
  font-size:22px;letter-spacing:1.5px;
  color:var(--gold);margin-bottom:14px;
}

/* ======== POZO / PRIZE POOL ======== */
.pozo-hero{
  background:linear-gradient(135deg,rgba(245,200,66,.12),rgba(124,92,255,.10));
  border:1px solid rgba(245,200,66,.25);
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
  position:relative;overflow:hidden;
}
.pozo-hero::before{
  content:'🏆';position:absolute;right:14px;top:50%;transform:translateY(-50%);
  font-size:72px;opacity:.07;
}
.pozo-title{
  font-family:'Bebas Neue',cursive;
  font-size:13px;letter-spacing:2px;color:var(--muted);margin-bottom:4px;
}
.pozo-amount{
  font-family:'Bebas Neue',cursive;
  font-size:52px;letter-spacing:1px;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1;
}
.pozo-currency{font-size:16px;color:var(--gold);font-weight:700;margin-left:4px}
.prize-splits{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.prize-split{
  background:rgba(0,0,0,.25);
  border-radius:12px;padding:12px;text-align:center;
  border:1px solid rgba(255,255,255,.06);
}
.prize-split.p1{border-color:rgba(245,200,66,.3)}
.prize-split.p2{border-color:rgba(154,176,200,.2)}
.prize-split.p3{border-color:rgba(196,122,58,.2)}
.split-medal{font-size:22px;margin-bottom:4px}
.split-pct{font-family:'Bebas Neue',cursive;font-size:26px;color:var(--text)}
.split-amt{font-size:13px;font-weight:700;color:var(--gold);margin:2px 0}
.split-lbl{font-size:10px;color:var(--muted)}
.pozo-config{display:flex;gap:8px;align-items:center;margin-top:12px}
.pozo-config input{
  flex:1;background:rgba(0,0,0,.3);border:1px solid var(--border);
  border-radius:10px;color:var(--text);padding:9px 14px;
  font-size:14px;font-family:'DM Sans',sans-serif;
  font-weight:700;
}
.pozo-config input::placeholder{color:var(--muted)}
.aporte-row{
  display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;
}
.aporte-chip{
  font-size:11px;font-weight:700;
  background:rgba(245,200,66,.1);
  border:1px solid rgba(245,200,66,.25);
  border-radius:20px;padding:5px 13px;
  color:var(--gold);cursor:pointer;transition:all .15s;
}
.aporte-chip:hover{background:rgba(245,200,66,.22)}

/* ======== KPI DASHBOARD ======== */
.kpi-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px;
  margin-bottom:16px;
}
.kpi{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 12px;
  position:relative;overflow:hidden;
  transition:transform .2s;
}
.kpi:hover{transform:translateY(-2px)}
.kpi::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
}
.kpi-neon::after{background:linear-gradient(90deg,var(--neon),var(--purple))}
.kpi-gold::after{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.kpi-green::after{background:linear-gradient(90deg,var(--green),#00b86c)}
.kpi-red::after{background:linear-gradient(90deg,var(--red),#ff8fa0)}
.kpi-purple::after{background:linear-gradient(90deg,var(--purple),#a080ff)}
.kpi-num{
  font-family:'Bebas Neue',cursive;
  font-size:34px;letter-spacing:.5px;line-height:1;
  margin-bottom:2px;
}
.kpi-lbl{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* ======== PODIUM ======== */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.pod-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;padding:16px 10px;
  text-align:center;position:relative;overflow:hidden;
  transition:transform .2s;
}
.pod-card:hover{transform:translateY(-3px)}
.pod-card.p1{border-color:rgba(245,200,66,.4);background:rgba(20,15,0,.8)}
.pod-card.p2{border-color:rgba(154,176,200,.3)}
.pod-card.p3{border-color:rgba(196,122,58,.25);background:rgba(15,10,5,.8)}
.pod-card::before{
  content:'';position:absolute;left:0;right:0;top:0;height:3px;
}
.p1::before{background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold))}
.p2::before{background:linear-gradient(90deg,#7a9bc0,#b0c8e0,#7a9bc0)}
.p3::before{background:linear-gradient(90deg,#8a5c3a,#c47a3a,#8a5c3a)}
.pod-medal{font-size:26px;margin-bottom:6px}
.pod-name{
  font-size:13px;font-weight:700;color:var(--text);
  margin-bottom:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pod-pts{
  font-family:'Bebas Neue',cursive;
  font-size:44px;letter-spacing:1px;color:var(--gold2);
  line-height:1;
}
.pod-lbl{font-size:10px;color:var(--muted);margin-bottom:8px}
.pod-prize{
  font-family:'Bebas Neue',cursive;
  font-size:18px;color:var(--gold);
  background:rgba(245,200,66,.1);
  border:1px solid rgba(245,200,66,.2);
  border-radius:8px;padding:4px 10px;margin-bottom:8px;
  display:inline-block;
}
.pod-stats{display:flex;justify-content:center;gap:10px;padding-top:8px;border-top:1px solid var(--border)}
.pod-stat{font-size:10px;color:var(--muted);text-align:center}
.pod-stat span{display:block;font-size:13px;font-weight:700;color:var(--text)}

/* ======== TABLA ======== */
.rank-tbl{width:100%;border-collapse:collapse;margin-top:4px}
.rank-tbl th{
  font-size:10px;color:var(--muted);font-weight:700;
  text-align:left;padding:7px 10px;
  border-bottom:1px solid var(--border);
  letter-spacing:.5px;text-transform:uppercase;
}
.rank-tbl td{font-size:13px;padding:9px 10px;border-bottom:1px solid rgba(30,58,95,.3);color:var(--text)}
.rank-tbl tr:hover td{background:rgba(255,255,255,.02)}
.pos-b{
  display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:50%;
  font-size:11px;font-weight:700;
  background:rgba(30,58,95,.6);color:var(--muted);
}
.pos-1{background:var(--gold);color:#1a0800}
.pos-2{background:var(--silver);color:#0a1628}
.pos-3{background:var(--bronze);color:#0a0800}
.bar-w{height:5px;background:rgba(30,58,95,.8);border-radius:3px;margin-top:3px;min-width:60px}
.bar-f{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--neon),var(--purple));transition:width .5s}
.bar-gold{background:linear-gradient(90deg,var(--gold),var(--gold2))}

/* ======== HONORES / CERTIFICADOS ======== */
.honores-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px;
  margin-bottom:16px;
}
.honor-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;padding:14px;
  text-align:center;
  transition:transform .2s;
  position:relative;overflow:hidden;
}
.honor-card:hover{transform:translateY(-2px)}
.honor-card::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
}
.honor-sniper::after{background:linear-gradient(90deg,var(--green),#00d46a)}
.honor-racha::after{background:linear-gradient(90deg,var(--red),#ff9f58)}
.honor-goleador::after{background:linear-gradient(90deg,var(--neon),var(--purple))}
.honor-consistente::after{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.honor-predictor::after{background:linear-gradient(90deg,var(--purple),#b080ff)}
.honor-ironico::after{background:linear-gradient(90deg,#ff6b9d,var(--red))}
.honor-emoji{font-size:32px;margin-bottom:8px}
.honor-title{
  font-family:'Bebas Neue',cursive;
  font-size:14px;letter-spacing:1px;color:var(--text);
  margin-bottom:4px;
}
.honor-winner{font-size:12px;font-weight:700;color:var(--gold);margin-bottom:4px}
.honor-desc{font-size:10px;color:var(--muted);line-height:1.4}
.honor-empty{font-size:10px;color:rgba(106,138,173,.4);font-style:italic}

/* ======== CERTIFICADO ======== */
.cert-modal{
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,.85);backdrop-filter:blur(10px);
  align-items:center;justify-content:center;padding:16px;
}
.cert-modal.open{display:flex}
.cert-box{
  background:#050d1a;
  border:2px solid var(--gold);
  border-radius:24px;
  padding:32px 24px;
  max-width:440px;width:100%;
  text-align:center;
  position:relative;
  box-shadow:0 0 60px rgba(245,200,66,.2);
  animation:certIn .4s ease;
}
@keyframes certIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.cert-corner{
  position:absolute;width:40px;height:40px;
  border-color:var(--gold);border-style:solid;
}
.cert-corner.tl{top:10px;left:10px;border-width:2px 0 0 2px;border-radius:6px 0 0 0}
.cert-corner.tr{top:10px;right:10px;border-width:2px 2px 0 0;border-radius:0 6px 0 0}
.cert-corner.bl{bottom:10px;left:10px;border-width:0 0 2px 2px;border-radius:0 0 0 6px}
.cert-corner.br{bottom:10px;right:10px;border-width:0 2px 2px 0;border-radius:0 0 6px 0}
.cert-logo{
  font-family:'Bebas Neue',cursive;
  font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:4px;
}
.cert-title{
  font-family:'Bebas Neue',cursive;
  font-size:15px;letter-spacing:2px;color:var(--neon);margin-bottom:12px;
}
.cert-emoji{font-size:56px;margin-bottom:10px}
.cert-award{
  font-family:'Bebas Neue',cursive;
  font-size:32px;letter-spacing:1px;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:6px;
}
.cert-name{
  font-family:'Bebas Neue',cursive;
  font-size:42px;letter-spacing:2px;color:var(--text);
  margin-bottom:8px;
}
.cert-desc{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.cert-pts{
  background:rgba(245,200,66,.1);border:1px solid rgba(245,200,66,.3);
  border-radius:10px;padding:8px 16px;display:inline-block;
  font-family:'Bebas Neue',cursive;font-size:18px;color:var(--gold);
  margin-bottom:16px;
}
.cert-date{font-size:10px;color:var(--muted);margin-bottom:16px}
.cert-close{position:absolute;top:12px;right:16px;font-size:20px;cursor:pointer;color:var(--muted);background:none;border:none}
.cert-close:hover{color:var(--text)}

/* ======== JUGADORES ======== */
.add-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.add-row input,.inp{
  background:rgba(0,0,0,.3);border:1px solid var(--border);
  border-radius:10px;color:var(--text);
  padding:9px 14px;font-size:13px;
  font-family:'DM Sans',sans-serif;
}
.add-row input::placeholder,.inp::placeholder{color:var(--muted)}
.add-row input:focus,.inp:focus{outline:none;border-color:rgba(0,220,255,.4)}
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.p-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:12px;text-align:center;
  transition:transform .2s;
}
.p-card:hover{transform:translateY(-2px)}
.p-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px}
.p-stat{font-size:11px;color:var(--muted);margin-bottom:8px}

/* ======== GRUPOS ======== */
.g-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.g-tab{
  font-size:11px;font-weight:700;
  padding:5px 11px;border-radius:8px;
  border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;
  transition:all .15s;
}
.g-tab.on{background:rgba(0,220,255,.15);color:var(--neon);border-color:rgba(0,220,255,.35)}
.grp-teams{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.team-pill{
  font-size:11px;font-weight:600;
  background:rgba(0,220,255,.06);
  border:1px solid rgba(0,220,255,.15);
  border-radius:20px;padding:4px 12px;color:var(--muted);
}

/* ======== MATCH CARDS ======== */
.m-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:10px 14px;margin-bottom:8px;
}
.m-card.done{border-left:3px solid var(--green)}
.m-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.m-date{font-size:10px;color:var(--muted);min-width:44px}
.m-teams{flex:1;font-size:14px;font-weight:600;color:var(--text)}
.m-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
.b-pend{background:rgba(30,58,95,.8);color:var(--muted)}
.b-done{background:rgba(0,255,157,.12);color:var(--green);border:1px solid rgba(0,255,157,.25)}
.res-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.s-in{
  width:48px;background:rgba(0,0,0,.4);
  border:1px solid var(--border);border-radius:8px;
  color:var(--text);text-align:center;
  padding:5px;font-size:14px;font-family:'JetBrains Mono',monospace;
}
.s-in:focus{outline:none;border-color:rgba(0,220,255,.4)}
.s-sep{color:var(--muted);font-size:16px;font-weight:700}
.pred-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px;margin-top:8px}
.pred-cell{
  background:rgba(10,20,40,.7);border:1px solid var(--border);
  border-radius:8px;padding:6px 8px;
}
.pred-name{font-size:10px;color:var(--muted);margin-bottom:2px;font-weight:600}
.pred-val{font-size:12px;font-weight:700;color:var(--text);font-family:'JetBrains Mono',monospace}
.pred-in{
  width:100%;background:transparent;border:none;
  border-bottom:1px solid var(--border);
  color:var(--text);font-size:11px;padding:2px 0;
  margin-top:2px;outline:none;font-family:'JetBrains Mono',monospace;
}
.pred-in:focus{border-color:var(--neon)}
.pred-in::placeholder{color:rgba(106,138,173,.4)}

/* ======== ELIMATORIAS ======== */
.phase-hdr{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
.phase-name{font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:1px;color:var(--gold)}
.phase-info{font-size:10px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:3px 10px}
.elim-note{font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:10px}

/* ======== REGLAS ======== */
.rules-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}
.rule-row{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid rgba(30,58,95,.4)}
.rule-row:last-child{border-bottom:none}
.rule-pts{min-width:48px;text-align:center}
.rule-num{font-family:'Bebas Neue',cursive;font-size:28px;color:var(--gold2)}
.rule-lbl{font-size:10px;color:var(--muted)}
.rule-txt{font-size:12px;color:var(--text);padding-top:3px}
.rule-txt em{display:block;color:var(--muted);font-style:normal;font-size:11px;margin-top:2px}

.goal-pop{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);

  animation:goalAnim 1.8s ease forwards;
}

  25%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(5deg)}
  80%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(2) rotate(10deg)}
}

function initM(){
  Object.keys(GM).forEach(g=>GM[g].forEach((m,i)=>{
    const id='g_'+g+'_'+i;
    if(!S.gM[id]) S.gM[id]={t1:m[1],t2:m[2],date:m[0],g1:'',g2:'',preds:{}};

    }
  });

}

// ===== SCORING =====
function pts(pred,g1,g2){
  if(!pred||pred.g1===''||pred.g2==='') return null;
  const pg1=+pred.g1,pg2=+pred.g2,rg1=+g1,rg2=+g2;
  if(isNaN(pg1)||isNaN(pg2)||isNaN(rg1)||isNaN(rg2)) return null;
  if(pg1===rg1&&pg2===rg2) return 5;
  const pd=pg1-pg2,rd=rg1-rg2;
  if(Math.sign(pd)===Math.sign(rd)&&pd===rd) return 3;
  if(Math.sign(pd)===Math.sign(rd)) return 1;
  return 0;
}

function stats(player){
  let p=0,ex=0,w=0,zeros=0,consec=0,maxConsec=0,tempConsec=0,played=0;
  const allM=Object.values({...S.gM,...S.eM});
  allM.forEach(m=>{
    if(m.g1==='') return;
    const pred=m.preds[player]; if(!pred) return;
    const v=pts(pred,m.g1,m.g2); if(v===null) return;
    played++;
    p+=v;
    if(v===5) ex++;
    if(v>=1){w++;tempConsec++;if(tempConsec>maxConsec)maxConsec=tempConsec;}
    else{zeros++;tempConsec=0;}
  });
  // current streak
  const done=allM.filter(m=>m.g1!=='');
  for(let i=done.length-1;i>=0;i--){
    const pred=done[i].preds[player];if(!pred) break;
    const v=pts(pred,done[i].g1,done[i].g2);if(v===null) break;
    if(v>=1) consec++; else break;
  }
  const pct=played>0?Math.round((ex/played)*100):0;
  return {p,ex,w,zeros,consec,maxConsec,played,pct};
}

function calcPozo(){
  const n=S.players.length;
  const total=S.pozo.aporte>0?n*S.pozo.aporte:S.pozo.monto;
  return {total,p1:Math.floor(total*.5),p2:Math.floor(total*.3),p3:Math.floor(total*.2)};
}

}

// ===== HONORES =====
function calcHonores(){
  if(!S.players.length) return [];
  const list=S.players.map(p=>({name:p,...stats(p)}));
  const h=[];

  // 1. Francotirador — más exactos
  const sniper=list.reduce((a,b)=>b.ex>a.ex?b:a,list[0]);
  h.push({key:'sniper',emoji:'🎯',title:'FRANCOTIRADOR',winner:sniper.ex>0?sniper.name:null,desc:`Más resultados exactos (5 pts c/u). Récord: ${sniper.ex} exactos.`,stat:`${sniper.ex} exactos`,cls:'honor-sniper'});

  // 2. Racha de fuego — racha activa más larga
  const racha=list.reduce((a,b)=>b.consec>a.consec?b:a,list[0]);
  h.push({key:'racha',emoji:'🔥',title:'RACHA DE FUEGO',winner:racha.consec>0?racha.name:null,desc:`Mayor racha activa de aciertos consecutivos. Racha: ${racha.consec} partidos.`,stat:`${racha.consec} seguidos`,cls:'honor-racha'});

  // 3. Mister Consistente — mayor % de aciertos (mín 5 predicciones)
  const cons=list.filter(p=>p.played>=5).reduce((a,b)=>b.pct>a.pct?b:a,list[0]||{pct:0,name:null});
  h.push({key:'cons',emoji:'⚖️',title:'MISTER CONSISTENTE',winner:cons&&cons.played>=5?cons.name:null,desc:`Mayor % de aciertos con mínimo 5 predicciones. Record: ${cons?.pct||0}%.`,stat:`${cons?.pct||0}% efectividad`,cls:'honor-consistente'});

  // 4. El Máquina de Puntos — más puntos fase grupos
  const grpPts=S.players.map(p=>{
    let pp=0;
    Object.values(S.gM).forEach(m=>{
      if(m.g1==='') return;
      const pred=m.preds[p];if(!pred)return;
      const v=pts(pred,m.g1,m.g2);if(v!==null)pp+=v;
    });
    return {name:p,pp};
  });
  const maquina=grpPts.reduce((a,b)=>b.pp>a.pp?b:a,grpPts[0]);
  h.push({key:'maquina',emoji:'⚙️',title:'MÁQUINA DE GRUPOS',winner:maquina&&maquina.pp>0?maquina.name:null,desc:`Más puntos acumulados en la Fase de Grupos. Récord: ${maquina?.pp||0} pts.`,stat:`${maquina?.pp||0} pts en grupos`,cls:'honor-goleador'});

  // 5. El Vidente — más puntos en Eliminatorias
  const elimPts=S.players.map(p=>{
    let ep=0;
    Object.values(S.eM).forEach(m=>{
      if(m.g1==='') return;
      const pred=m.preds[p];if(!pred)return;
      const v=pts(pred,m.g1,m.g2);if(v!==null)ep+=v;
    });
    return {name:p,ep};
  });
  const vidente=elimPts.reduce((a,b)=>b.ep>a.ep?b:a,elimPts[0]);
  h.push({key:'vidente',emoji:'🔮',title:'EL VIDENTE',winner:vidente&&vidente.ep>0?vidente.name:null,desc:`Más puntos en la fase Eliminatoria. Récord: ${vidente?.ep||0} pts.`,stat:`${vidente?.ep||0} pts en elim`,cls:'honor-predictor'});

  // 6. El Incomprendido — más puntos a pesar de 0 exactos (o menos exactos entre top3)
  const sorted=list.slice().sort((a,b)=>b.p-a.p);
  const top3=sorted.slice(0,3);
  const incomp=top3.length?top3.reduce((a,b)=>b.ex<a.ex?b:a,top3[0]):null;
  h.push({key:'incomp',emoji:'🤡',title:'EL INCOMPRENDIDO',winner:incomp&&incomp.p>0?incomp.name:null,desc:`Top 3 con menos exactos. Gana sin cepar el resultado exacto.`,stat:incomp?`${incomp.p}pts, ${incomp.ex} exactos`:'',cls:'honor-ironico'});

  return h;
}

  const el=document.getElementById('sec-ranking');

// ===== MATCH CARD =====
function matchCard(id,m,isElim){
  const done=m.g1!==''&&m.g2!=='';
  const pend=isElim&&(m.t1==='Por definir'||m.t2==='Por definir');
  let h=`<div class="m-card ${done?'done':''}">
    <div class="m-top">
      <span class="m-date">${m.date||''}</span>
      <span class="m-teams">${m.t1} <span style="color:var(--muted);font-size:11px;font-weight:400">vs</span> ${m.t2}</span>
      <span class="m-badge ${done?'b-done':'b-pend'}">${done?m.g1+' - '+m.g2+' ✓':'Pendiente'}</span>
    </div>`;
  if(!done&&!pend){
    h+=`<div class="res-row">
      <span style="font-size:11px;color:var(--muted)">Resultado:</span>
      <input class="s-in" type="number" id="r1-${id}" min="0" max="20" placeholder="L"/>
      <span class="s-sep">–</span>
      <input class="s-in" type="number" id="r2-${id}" min="0" max="20" placeholder="V"/>
      <button class="btn-sm btn-outline" onclick="saveResult('${id}')">✓ Guardar</button>
    </div>`;
  }
  if(S.players.length){
    h+='<div class="pred-grid">';
    S.players.forEach(p=>{
      const pred=m.preds[p];
      let badge='',col='var(--muted)';
      if(done&&pred){
        const v=pts(pred,m.g1,m.g2);
        if(v===5){badge=' +5🎯';col='var(--green)';}
        else if(v===3){badge=' +3✓';col='var(--neon)';}
        else if(v===1){badge=' +1';col='var(--gold)';}
        else{badge=' 0';col='var(--red)';}
      }
      h+=`<div class="pred-cell"><div class="pred-name">${p}</div>`;
      if(done&&pred){
        h+=`<div class="pred-val" style="color:${col}">${pred.g1}–${pred.g2}${badge}</div>`;
      } else if(!done&&!pend){
        const v=pred?(pred.g1+'-'+pred.g2):'';
        h+=`<input class="pred-in" type="text" placeholder="ej: 2-1" value="${v}" onchange="savePred('${id}','${p}',this.value)"/>`;
      } else {
        h+=`<div class="pred-val" style="color:rgba(106,138,173,.3)">—</div>`;
      }
      h+='</div>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function savePred(mid,player,val){
  val=(val||'').trim();
  const m=S.gM[mid]||S.eM[mid]; if(!m) return;
  if(!val){delete m.preds[player];save();return;}
  const parts=val.split(/[-:]/).map(x=>parseInt(x.trim()));
  if(parts.length===2&&!isNaN(parts[0])&&!isNaN(parts[1])){
    m.preds[player]={g1:parts[0],g2:parts[1]};save();
  }
}

function saveResult(mid){
  const v1=document.getElementById('r1-'+mid),v2=document.getElementById('r2-'+mid);
  if(!v1||!v2||v1.value===''||v2.value==='') return;
  const g1=parseInt(v1.value),g2=parseInt(v2.value);
  if(isNaN(g1)||isNaN(g2)) return;
  const m=S.gM[mid]||S.eM[mid]; if(!m) return;
  m.g1=g1;m.g2=g2;save();
  renderRanking();renderDashboard();renderHonores();
  showGoal();
  const cur=document.querySelector('.tab.on').getAttribute('onclick').match(/'([^']+)'/)[1];
  if(cur==='grupos') renderGrupos();
  else if(cur==='elim') renderElim();
}

  const medals=['🥇','🥈','🥉'];
  let msg='🏆 *SUPER MUNDIAL 2026*\n📊 Tabla actualizada\n\n';
  list.forEach((s,i)=>{msg+=`${medals[i]||`${i+1}.`} *${s.name}* — ${s.p} pts (${s.ex} exactos)\n`;});
  if(pozo.total>0) msg+=`\n💰 Pozo: $${pozo.total.toLocaleString()} · 1ro: $${pozo.p1.toLocaleString()} · 2do: $${pozo.p2.toLocaleString()} · 3ro: $${pozo.p3.toLocaleString()}`;
  const total=Object.values({...S.gM,...S.eM}).filter(m=>m.g1!=='').length;
  msg+=`\n\n⚽ Partidos jugados: ${total}/104\n_5pts exacto · 3pts misma diferencia · 1pt ganador_\n_¡Manden sus predicciones antes del pitazo!_`;
  out.textContent=msg;out.style.display='block';cbtn.style.display='inline-block';
}
function copyWSP(){
  const out=document.getElementById('wsp-out');
  if(!out||!out.textContent) return;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(out.textContent).then(()=>{
      const btn=document.getElementById('copy-btn');
      btn.textContent='¡Copiado! ✓';
      setTimeout(()=>{btn.textContent='📋 Copiar texto';},2000);
    }).catch(()=>fallbackCopy(out.textContent));
  } else fallbackCopy(out.textContent);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.cssText='position:absolute;left:-9999px;top:0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
}

// ===== NAVIGATION =====
function goTab(name){
  const ns=['ranking','dashboard','honores','players','grupos','elim','rules'];
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',ns[i]===name));
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  const sec=document.getElementById('sec-'+name);
  if(sec) sec.classList.add('on');
  if(name==='ranking') renderRanking();
  else if(name==='dashboard') renderDashboard();
  else if(name==='honores') renderHonores();
  else if(name==='players') renderPlayers();
  else if(name==='grupos') renderGrupos();
  else if(name==='elim') renderElim();
  else if(name==='rules') renderRules();
}

function resetResultados(){
  if(confirm('¿Borrar todos los marcadores finales? La tabla volverá a cero.')){
    Object.values(S.gM).forEach(m=>{m.g1='';m.g2='';});
    Object.values(S.eM).forEach(m=>{m.g1='';m.g2='';});
    save();location.reload();
  }
}

// ===== GOAL ANIMATION =====
function showGoal(){
  const d=document.createElement('div');
  d.className='goal-pop';d.textContent='⚽';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),1800);
}

// ===== INIT =====
load();initM();
renderRanking();renderPlayers();renderGrupos();renderElim();renderRules();
</script>
