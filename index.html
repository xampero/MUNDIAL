    if(!S.gM[id]) S.gM[id]={t1:m[1],t2:m[2],date:m[0],g1:'',g2:'',preds:{}};
  }));
  EROUNDS.forEach(r=>{
    for(let i=0;i<r.count;i++){
      const id='e_'+r.id+'_'+i;
      if(!S.eM[id]) S.eM[id]={t1:'Por definir',t2:'Por definir',date:r.dates,g1:'',g2:'',preds:{},round:r.id};
    }
  });
  save();
}

function pts(pred,g1,g2){
  if(!pred||pred.g1===''||pred.g2==='') return null;
  const pg1=+pred.g1,pg2=+pred.g2,rg1=+g1,rg2=+g2;
  if(isNaN(pg1)||isNaN(pg2)||isNaN(rg1)||isNaN(rg2)) return null;
  if(pg1===rg1&&pg2===rg2) return 5;
  const pd=pg1-pg2,rd=rg1-rg2;
  if(Math.sign(pd)===Math.sign(rd)&&pd===rd) return 3;
  if(Math.sign(pd)===Math.sign(rd)) return 1;
  return 0;
}

function stats(player){
  let p=0,ex=0,w=0;
  Object.values({...S.gM,...S.eM}).forEach(m=>{
    if(m.g1==='') return;
    const pred=m.preds[player]; if(!pred) return;
    const v=pts(pred,m.g1,m.g2); if(v===null) return;
    p+=v; if(v===5)ex++; if(v>=1)w++;
  });
  return {p,ex,w};
}

function matchCard(id,m,isElim){
  const done=m.g1!==''&&m.g2!=='';
  const pend=isElim&&(m.t1==='Por definir'||m.t2==='Por definir');
  let h=`<div class="m-card ${done?'done':''}">
    <div class="m-top">
      <span class="m-date">${m.date||''}</span>
      <span class="m-teams" style="font-size:15px">${m.t1} <span style="color:var(--fc-muted);font-size:12px;font-weight:400">vs</span> ${m.t2}</span>
      <span class="m-badge ${done?'b-done':'b-pend'}">${done?m.g1+' - '+m.g2+' ✓':'Pendiente'}</span>
    </div>`;
  if(!done&&!pend){
    h+=`<div class="res-row">
      <span style="font-size:11px;color:var(--fc-muted)">Resultado:</span>
      <input class="s-in" type="number" id="r1-${id}" min="0" max="20" placeholder="L"/>
      <span class="s-sep">–</span>
      <input class="s-in" type="number" id="r2-${id}" min="0" max="20" placeholder="V"/>
      <button class="fc-btn-sm" onclick="saveResult('${id}')"><i class="ti ti-check" aria-hidden="true"></i> Guardar</button>
    </div>`;
  }
  if(S.players.length){
    h+='<div class="pred-grid">';
    S.players.forEach(p=>{
      const pred=m.preds[p];
      let badge='',col='var(--fc-muted)';
      if(done&&pred){
        const v=pts(pred,m.g1,m.g2);
        if(v===5){badge=' +5🎯';col='var(--fc-green)';}
        else if(v===3){badge=' +3✓';col='var(--fc-cyan)';}
        else if(v===1){badge=' +1';col='var(--fc-gold-lt)';}
        else{badge=' 0';col='#E24B4A';}
      }
      h+=`<div class="pred-cell"><div class="pred-name">${p}</div>`;
      if(done&&pred){
        h+=`<div class="pred-val" style="color:${col}">${pred.g1}–${pred.g2}${badge}</div>`;
      } else if(!done&&!pend){
        const v=pred?(pred.g1+'-'+pred.g2):'';
        h+=`<input class="pred-in" type="text" placeholder="ej: 2-1" value="${v}" onchange="savePred('${id}','${p}',this.value)"/>`;
      } else {
        h+=`<div class="pred-val" style="color:var(--fc-muted)">—</div>`;
      }
      h+='</div>';
    });
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function savePred(mid,player,val){
  val=(val||'').trim();
  const m=S.gM[mid]||S.eM[mid]; if(!m) return;
  if(!val){delete m.preds[player];save();return;}
  const parts=val.split(/[-:]/).map(x=>parseInt(x.trim()));
  if(parts.length===2&&!isNaN(parts[0])&&!isNaN(parts[1])){
    m.preds[player]={g1:parts[0],g2:parts[1]};save();
  }
}

function saveResult(mid){
  const v1=document.getElementById('r1-'+mid),v2=document.getElementById('r2-'+mid);
  if(!v1||!v2||v1.value===''||v2.value==='') return;
  const g1=parseInt(v1.value),g2=parseInt(v2.value);
  if(isNaN(g1)||isNaN(g2)) return;
  const m=S.gM[mid]||S.eM[mid]; if(!m) return;
  m.g1=g1;m.g2=g2;save();
  renderRanking();
  const cur=document.querySelector('.tab.on').getAttribute('onclick').match(/'([^']+)'/)[1];
  if(cur==='grupos') renderGrupos();
  else if(cur==='elim') renderElim();
}

    <div class="rule-row"><div class="rule-pts"><div class="rule-num">3</div><div class="rule-lbl">pts</div></div><div class="rule-txt">Ganador correcto + misma diferencia de goles<em>Predijiste 2-0, terminó 3-1 (ambos +2) ✅</em></div></div>

  <button class="fc-btn" onclick="genWSP()"><i class="ti ti-brand-whatsapp" aria-hidden="true"></i> Generar tabla para WhatsApp</button>
  <div id="wsp-out" class="wsp-area"></div>
  <button id="copy-btn" class="copy-btn" onclick="copyWSP()"><i class="ti ti-copy" aria-hidden="true"></i> Copiar texto</button>
  </div>`;
}

function genWSP(){
  const out=document.getElementById('wsp-out');
  const cbtn=document.getElementById('copy-btn');
  if(!S.players.length){out.style.display='none';cbtn.style.display='none';return;}
  const list=S.players.map(p=>({name:p,...stats(p)})).sort((a,b)=>b.p-a.p);
  const medals=['🥇','🥈','🥉'];
  let msg='🏆 *JUEGO MUNDIAL 2026 - EL EMPERADOR*\n📊 Tabla actualizada\n\n';
  list.forEach((s,i)=>{msg+=`${medals[i]||`${i+1}.`} *${s.name}* — ${s.p} pts (${s.ex} exactos)\n`;});
  const total=Object.values({...S.gM,...S.eM}).filter(m=>m.g1!=='').length;
  msg+=`\n⚽ Partidos jugados: ${total}/104\n_5pts exacto · 3pts misma diferencia · 1pt ganador_\n_¡Manden sus predicciones antes del pitazo!_`;
  out.textContent=msg;
  out.style.display='block';
  cbtn.style.display='inline-block';
}

function copyWSP(){
  const out=document.getElementById('wsp-out');
  if(!out||!out.textContent) return;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(out.textContent).then(()=>{
      const btn=document.getElementById('copy-btn');
      btn.textContent='¡Copiado! ✓';
      setTimeout(()=>{btn.innerHTML='<i class="ti ti-copy" aria-hidden="true"></i> Copiar texto';},2000);
    }).catch(()=>fallbackCopy(out.textContent));
  } else { fallbackCopy(out.textContent); }
}

function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.cssText='position:absolute;left:-9999px;top:0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{
    document.execCommand('copy');
    const btn=document.getElementById('copy-btn');
    if(btn){btn.textContent='¡Copiado! ✓';setTimeout(()=>{btn.innerHTML='<i class="ti ti-copy" aria-hidden="true"></i> Copiar texto';},2000);}
  }catch(e){}
  document.body.removeChild(ta);
}

function goTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    const ns=['ranking','players','grupos','elim','rules'];
    t.classList.toggle('on',ns[i]===name);
  });
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  const sec=document.getElementById('sec-'+name);
  if(sec) sec.classList.add('on');
  if(name==='ranking') renderRanking();
  else if(name==='players') renderPlayers();
  else if(name==='grupos') renderGrupos();
  else if(name==='elim') renderElim();
  else if(name==='rules') renderRules();
}
// --- NUEVA FUNCIÓN PARA REINICIAR RESULTADOS ---
function resetResultados() {
  if (confirm('¿Estás seguro de que quieres borrar todos los marcadores finales cargados? La tabla volverá a cero.')) {
    // Limpiar los resultados de la Fase de Grupos
    Object.values(S.gM).forEach(m => { m.g1 = ''; m.g2 = ''; });
    // Limpiar los resultados de las Eliminatorias
    Object.values(S.eM).forEach(m => { m.g1 = ''; m.g2 = ''; });
    
    // Guardar los cambios y recargar la página para actualizar la vista
    save();
    location.reload();
  }
}
// -----------------------------------------------
load(); initM();
renderRanking(); renderPlayers(); renderGrupos(); renderElim(); renderRules();
</script>
